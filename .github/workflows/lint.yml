name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - name: Check zsh syntax
        run: |
          zsh -n zsh/.zshrc
          zsh -n zsh/.zprofile
          zsh -n zsh/.zshenv
      - name: Run shellcheck
        run: shellcheck zsh/.zshrc zsh/.zprofile 2>/dev/null || true

  stow-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stow
        run: sudo apt-get update && sudo apt-get install -y stow && mkdir -p /tmp/zonfig-test
      - name: Validate stow links
        run: stow -n -v -t /tmp/zonfig-test zsh
